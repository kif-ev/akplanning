stages:
  - setup
  - test
  - deploy

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  MYSQL_DATABASE: "test"
  MYSQL_ROOT_PASSWORD: "mysql"
  MYSQL_USER: "django"
  MYSQL_PASSWORD: "mysql"
  MYSQL_HOST: "mysql"

default:
  # Python version of the production deployment, image includes uv and build dependencies (e.g., for mysqlclient)
  image: ghcr.io/astral-sh/uv:python3.13-trixie
  # The virtualenv is built by the installation job only, all other jobs just use it
  # Key it on the core requirements to not mix up virtualenvs for different requirements
  # (GitLab supports at most two files here, hence all jobs additionally check a fingerprint of all inputs, see below)
  cache: &venv_cache
    key:
      files:
        - requirements/core.txt
        - requirements/mysql.txt
    paths:
      - .cache/pip
      - venv/
    policy: pull

# Fingerprint of everything the virtualenv is built from (Python version, setup script, all requirements)
# and its location (scripts in the virtualenv contain absolute paths, which differ, e.g., between concurrent runner slots)
.venv_fingerprint:
  script:
    - VENV_FINGERPRINT=$( (echo "$CI_PROJECT_DIR"; python -VV; cat Utils/setup.sh requirements.txt requirements/*.txt) | sha256sum | cut -d ' ' -f 1)

# Jobs using the virtualenv built by the installation job
.venv:
  needs:
    - installation
  before_script:
    - !reference [ .venv_fingerprint, script ]
    # The cache may have been overwritten in the meantime (e.g., by a concurrent pipeline with a different configuration)
    - |
      if [ "$(cat venv/.fingerprint 2>/dev/null)" != "$VENV_FINGERPRINT" ]; then
        echo "Cached virtualenv does not match the configuration of this pipeline, please retry the installation job"
        exit 1
      fi
    - source venv/bin/activate

installation:
  stage: setup
  cache:
    <<: *venv_cache
    policy: pull-push
  script:
    - python -V  # Print out python version for debugging
    - apt-get -qq update
    - apt-get -qq install -y --no-install-recommends gettext
    # Only reuse a cached virtualenv built from the same configuration, rebuild it from scratch otherwise
    - !reference [ .venv_fingerprint, script ]
    - |
      if [ "$(cat venv/.fingerprint 2>/dev/null)" = "$VENV_FINGERPRINT" ]; then
        echo "Reusing cached virtualenv"
        source venv/bin/activate
        # Translations are compiled from the repository and hence always needed
        DJANGO_SETTINGS_MODULE=AKPlanning.settings_ci python manage.py compilemessages -l de_DE
      else
        echo "Building virtualenv"
        # Install virtualenv for the Python of the image (the Debian package would use the system Python instead)
        pip install virtualenv
        ./Utils/setup.sh --ci
        echo "$VENV_FINGERPRINT" > venv/.fingerprint
      fi
  artifacts:
    # Compiled translations are not part of the repository but needed by later jobs (e.g., tests)
    paths:
      - "**/locale/**/*.mo"
    exclude:
      # Translations of installed packages are already part of the cached virtualenv
      - "venv/**/*"
    expire_in: 1 day

migrations:
  extends: .venv
  stage: test
  script:
    - ./manage.py makemigrations --dry-run --check

test:
  extends: .venv
  services:
    - mysql
  stage: test
  script:
    - apt-get -qq update
    - apt-get -qq install -y --no-install-recommends default-mysql-client
    - mysql --version
    - |
      for i in {1..30}; do
        if mysql -u root -p"${MYSQL_ROOT_PASSWORD}" -h mysql --skip-ssl -e "SELECT 1" > /dev/null 2>&1; then
          echo "MySQL is ready"
          break
        fi
        echo "Waiting for MySQL... ($i/30)"
        sleep 2
      done
    - |
      mysql -u root -p"${MYSQL_ROOT_PASSWORD}" -h mysql --skip-ssl --execute="\
        CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';\
        GRANT ALL PRIVILEGES ON *.* TO '${MYSQL_USER}'@'%' WITH GRANT OPTION;\
        FLUSH PRIVILEGES;\
      "
    - coverage run --source='.' manage.py test --settings AKPlanning.settings_ci
  after_script:
    # Runs in a separate shell, hence the virtualenv activated in before_script is not active here
    - venv/bin/coverage report
    - venv/bin/coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: unit.xml
    # Test results are most relevant for failing runs
    when: always

lint:
  extends: .venv
  stage: test
  script:
    - mkdir -p public/badges public/lint
    - echo undefined > public/badges/$CI_JOB_NAME.score
    # Fail if pylint itself fails (e.g., crashes), not only if tee fails
    - set -o pipefail
    # Analyze only once and write all reports at the same time (text to stdout, the others to their files)
    - pylint --load-plugins pylint_django --django-settings-module=AKPlanning.settings_ci --rcfile pylintrc --exit-zero --output-format=text,pylint_gitlab.GitlabCodeClimateReporter:codeclimate.json,pylint_gitlab.GitlabPagesHtmlReporter:public/lint/index.html AK* | tee /tmp/pylint.txt
    - sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' /tmp/pylint.txt > public/badges/$CI_JOB_NAME.score
  after_script:
    - |
      echo "Linting score: $(cat public/badges/$CI_JOB_NAME.score)"
  artifacts:
    paths:
      - public
    reports:
      codequality: codeclimate.json
    when: always

doc:
  extends: .venv
  stage: test
  script:
    - cd docs
    - make html
  artifacts:
    paths:
      - docs/_build/html

pages:
  stage: deploy
  image: alpine:latest
  # Only publishes the lint results, hence neither needs the virtualenv nor the artifacts of other jobs
  cache: [ ]
  needs:
    - lint
  script:
    - echo
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

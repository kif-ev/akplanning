stages:
  - setup
  - test
  - deploy

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  MYSQL_DATABASE: "test"
  MYSQL_ROOT_PASSWORD: "mysql"
  MYSQL_USER: "django"
  MYSQL_PASSWORD: "mysql"
  MYSQL_HOST: "mysql"

default:
  # Python version of the production deployment, image includes uv and build dependencies (e.g., for mysqlclient)
  image: ghcr.io/astral-sh/uv:python3.13-trixie
  # Allow GitLab to cancel pipelines made redundant by newer commits on the same branch
  interruptible: true
  # The virtualenv is built by the installation job only, all other jobs just use it
  # Key it on the core requirements to not mix up virtualenvs for different requirements
  # (GitLab supports at most two files here, hence all jobs additionally check a fingerprint of all inputs, see below)
  cache:
    - &venv_cache
      key:
        files:
          - requirements/core.txt
          - requirements/mysql.txt
      paths:
        - venv/
      policy: pull

# Fingerprint of everything the virtualenv is built from (Python version, setup script, all requirements)
# Its location is deliberately not part of it, as it differs, e.g., between concurrent runner slots
.venv_fingerprint:
  script:
    - VENV_FINGERPRINT=$( (python -VV; cat Utils/setup.sh requirements.txt requirements/*.txt) | sha256sum | cut -d ' ' -f 1)

# Use the virtualenv independent of its location: activate and the installed scripts (e.g., coverage) contain
# the absolute path it was built at, hence only use its Python and run tools as modules (python -m ...)
.venv_use:
  script:
    - export PATH="$CI_PROJECT_DIR/venv/bin:$PATH"

# Jobs using the virtualenv built by the installation job
.venv:
  needs:
    - installation
  before_script:
    - !reference [ .venv_fingerprint, script ]
    # The cache may have been overwritten in the meantime (e.g., by a concurrent pipeline with a different configuration)
    - |
      if [ "$(cat venv/.fingerprint 2>/dev/null)" != "$VENV_FINGERPRINT" ]; then
        echo "Cached virtualenv does not match the configuration of this pipeline, please retry the installation job"
        exit 1
      fi
    - !reference [ .venv_use, script ]

installation:
  stage: setup
  cache:
    - <<: *venv_cache
      policy: pull-push
    # Downloaded packages only speed up rebuilding the virtualenv, hence no other job needs them
    # (pip's cache is content-addressed, so one cache can safely be shared by all requirements)
    - key: pip
      paths:
        - .cache/pip
      policy: pull-push
  script:
    - python -V  # Print out python version for debugging
    - apt-get -qq update
    - apt-get -qq install -y --no-install-recommends gettext
    # Only reuse a cached virtualenv built from the same configuration, rebuild it from scratch otherwise
    - !reference [ .venv_fingerprint, script ]
    - |
      if [ "$(cat venv/.fingerprint 2>/dev/null)" = "$VENV_FINGERPRINT" ]; then
        echo "Reusing cached virtualenv"
        export PATH="$CI_PROJECT_DIR/venv/bin:$PATH"
        # Translations are compiled from the repository and hence always needed
        DJANGO_SETTINGS_MODULE=AKPlanning.settings_ci python manage.py compilemessages -l de_DE --ignore venv --ignore .cache
      else
        echo "Building virtualenv"
        # Install virtualenv for the Python of the image (the Debian package would use the system Python instead)
        pip install virtualenv
        ./Utils/setup.sh --ci
        echo "$VENV_FINGERPRINT" > venv/.fingerprint
      fi
  artifacts:
    # Compiled translations are not part of the repository but needed by later jobs (e.g., tests)
    paths:
      - "**/locale/**/*.mo"
    exclude:
      # Translations of installed packages are already part of the cached virtualenv
      - "venv/**/*"
    expire_in: 1 day

migrations:
  extends: .venv
  stage: test
  script:
    - ./manage.py makemigrations --dry-run --check

test:
  extends: .venv
  services:
    - mysql
  stage: test
  script:
    # Wait for MySQL and allow the test user to create the test database
    # (uses the MySQL driver of the virtualenv to not install a MySQL client in every run)
    - |
      python - <<'EOF'
      import os
      import time

      import MySQLdb

      for attempt in range(1, 31):
          try:
              connection = MySQLdb.connect(host="mysql", user="root", password=os.environ["MYSQL_ROOT_PASSWORD"])
              break
          except MySQLdb.OperationalError as error:
              print(f"Waiting for MySQL... ({attempt}/30): {error}")
              time.sleep(2)
      else:
          raise SystemExit("MySQL did not become ready")
      print(f"MySQL {connection.get_server_info()} is ready")

      cursor = connection.cursor()
      user, password = os.environ["MYSQL_USER"], os.environ["MYSQL_PASSWORD"]
      cursor.execute("CREATE USER IF NOT EXISTS %s@'%%' IDENTIFIED BY %s", (user, password))
      cursor.execute("GRANT ALL PRIVILEGES ON *.* TO %s@'%%' WITH GRANT OPTION", (user,))
      cursor.execute("FLUSH PRIVILEGES")
      EOF
    - python -m coverage run --source='.' manage.py test --settings AKPlanning.settings_ci
  after_script:
    # Runs in a separate shell, hence the virtualenv set up in before_script is not used here
    - venv/bin/python -m coverage report
    - venv/bin/python -m coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: unit.xml
    # Test results are most relevant for failing runs
    when: always

lint:
  extends: .venv
  stage: test
  script:
    - mkdir -p public/badges public/lint
    - echo undefined > public/badges/$CI_JOB_NAME.score
    # Fail if pylint itself fails (e.g., crashes), not only if tee fails
    - set -o pipefail
    # Analyze only once and write all reports at the same time (text to stdout, the others to their files)
    - python -m pylint --load-plugins pylint_django --django-settings-module=AKPlanning.settings_ci --rcfile pylintrc --exit-zero --output-format=text,pylint_gitlab.GitlabCodeClimateReporter:codeclimate.json,pylint_gitlab.GitlabPagesHtmlReporter:public/lint/index.html AK* | tee /tmp/pylint.txt
    - sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' /tmp/pylint.txt > public/badges/$CI_JOB_NAME.score
  after_script:
    - |
      echo "Linting score: $(cat public/badges/$CI_JOB_NAME.score)"
  artifacts:
    paths:
      - public
    reports:
      codequality: codeclimate.json
    when: always

doc:
  extends: .venv
  stage: test
  script:
    - cd docs
    - make html SPHINXBUILD="python -m sphinx"
  artifacts:
    paths:
      - docs/_build/html

pages:
  stage: deploy
  image: alpine:latest
  # Do not cancel a running deployment
  interruptible: false
  # Only publishes the lint results, hence neither needs the virtualenv nor the artifacts of other jobs
  cache: [ ]
  needs:
    - lint
  script:
    - echo
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

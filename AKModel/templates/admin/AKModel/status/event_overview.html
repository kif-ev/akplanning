{% load i18n %}
{% load tz %}

{% timezone event.timezone %}
    <h2>{% include "AKModel/event_hidden_icon.html" %}<a href="{% url 'admin:AKModel_event_change' event.pk %}">{{ event }}</a></h2>
    <h5>{{ event.start }} - {{ event.end }}</h5>

    <div class="form-check form-switch mt-2 mb-2">
        <input type="checkbox" class="form-check-input" id="planPublishedSwitch"
               {% if not event.plan_hidden %}checked{% endif %}
               data-url="
                       {% if event.plan_hidden %}{% url 'admin:plan-publish' %}{% else %}{% url 'admin:plan-unpublish' %}{% endif %}?pks={{ event.pk }}"
               onclick="location.href = this.dataset.url;">
        <label class="form-check-label" for="planPublishedSwitch">{% trans "Plan published?" %}</label>
    </div>
{% endtimezone %}

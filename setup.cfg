[pycodestyle]
max-line-length = 120
exclude = migrations,static
max-complexity = 11

[mypy]
python_version = 3.13
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
files = AKDashboard, AKModel, AKOnline, AKPlan, AKPlanning, AKPreference, AKScheduling, AKSolverInterface, AKSubmission, manage.py
exclude = (^|/)(migrations|venv|Solver)/|^AKPlanning/(settings_secrets\.py$|settings/)
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
ignore_missing_imports = True
check_untyped_defs = True

[mypy.plugins.django-stubs]
django_settings_module = AKPlanning.settings_ci
